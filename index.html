<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>羽田空港 出発時刻表 (Solari Board)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-container">
    <!-- 上部メインエリア (ソラリーボード) -->
    <section class="main-section">
      <div class="solari-board-container">
        <div class="solari-header">
          <div id="headFlight">便名</div>
          <div id="headDest">行先</div>
          <div id="headTime">時刻</div>
          <div id="headGate">搭乗口</div>
          <div id="headRemarks">備考</div>
        </div>
        <div class="solari-rows" id="solariRows">
          <!-- 動的生成 -->
        </div>
        <div class="no-flights-message" id="noFlightsMessage" style="display: none;">
          本日の出発便はありません
        </div>
      </div>
    </section>

    <!-- 下部 時計エリア -->
    <footer class="clock-section">
      <div class="date-display" id="dateDisplay">2026年--月--日 (-)</div>
      <div class="time-display">
        <span class="time-unit" id="hoursDisplay">00</span>
        <span class="time-colon">:</span>
        <span class="time-unit" id="minutesDisplay">00</span>
        <span class="time-colon">:</span>
        <span class="time-unit" id="secondsDisplay">00</span>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
